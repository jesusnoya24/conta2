name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependencias
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.36 virtualenv
      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Falta el secreto KEYSTORE_BASE64 en Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/contador.keystore"
          echo "P4A_RELEASE_KEYSTORE=$RUNNER_TEMP/contador.keystore" >> "$GITHUB_ENV"
      - name: Configurar APK firmado
        run: |
          grep -q '^android.release_artifact' buildozer.spec || sed -i '/^\[app\]/a android.release_artifact = apk' buildozer.spec
      - name: Compilar
        shell: bash
        env:
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
        run: buildozer -v android release 2>&1 | tee build.log
      - name: Ver el error
        if: failure()
        run: |
          echo "=== ultimas lineas ==="
          tail -n 60 build.log | cut -c1-300
      - name: Verificar firma
        continue-on-error: true
        run: |
          APKSIGNER=$(find ~/.buildozer -name apksigner -type f | head -n 1)
          for f in bin/*.apk; do
            echo "== $f =="
            "$APKSIGNER" verify --print-certs "$f" | head -n 4
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: |
            bin/*.apk
            build.log
